    description: "Send the user to a URL outside the app. ExternalLink is the primitive over expo-web-browser and Linking; ExternalLinkButton is the call-to-action shaped call site and ExternalLinkText the inline one inside a sentence. How the link opens is decided per platform — an in-app browser or the system one on native, a new tab or the same one on web — and the two wrappers already pick the usual answer. Load when linking out to external URLs from alouette UI."
