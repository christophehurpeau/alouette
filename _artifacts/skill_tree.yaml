    description: "Styling conventions for writing components with alouette: express enum-like props (variant/size/shadow/state) as tailwind-variants tv() variants instead of a Record lookup, give one component a single tv() with slots instead of several tv objects, style through className instead of inline style, and write pixel sizes as arbitrary values (w-[380px]) rather than the canonical spacing-scale class. States the alouette design principles every component must satisfy, including that interactivity is a component and never a wrapper. Load when writing, restyling or reviewing a component."
    requires:
      - "alouette-theming"
    sources:
      - "christophehurpeau/alouette:packages/alouette/src/ui/containers/Modal.tsx"
      - "christophehurpeau/alouette:packages/alouette/src/ui/containers/Surface.tsx"
      - "christophehurpeau/alouette:packages/alouette/src/ui/selection/SegmentedItem.tsx"

  - name: "alouette-icons"
    slug: "alouette-icons"
    type: "composition"
    domain: "layout"
    path: "packages/alouette/skills/alouette-icons/SKILL.md"
    package: "packages/alouette"
    description: "Use Phosphor icons with alouette. Each icon is imported from its own module (alouette-icons/phosphor-icons/IconName) so only what is used is bundled, and is then either rendered through the Icon component or handed as an element to a component that takes one (Button, IconButton, Message). Its color comes from a text-* token class rather than from the SVG, so an icon follows the theme and the accent around it. Load when adding icons to alouette UI."
    requires:
