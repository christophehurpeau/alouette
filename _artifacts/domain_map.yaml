  - name: "Display data annotations"
    slug: "alouette-data"
    domain: "data"
    description: "Show a value the app already holds. Badge labels something with a status, count or category pill; Avatar stands for a person or account; EditableItem shows one labelled value behind an edit affordance and EditableSurface a whole titled section behind one; Bullet is an icon + text list row; Code and CodeBlock render source inline and as a block; Blockquote and Citation render a quoted excerpt and its attribution. All are display-only — they own no editor and no press handling, and are never wrapped in a Link or Pressable to gain one. Load when showing a status chip, a list row, an avatar, a value or section with an edit affordance, code, a quote or its attribution."
    type: "core"
    packages: ["alouette"]
    covers:
      - "Badge (accent, size, variant, icon, children)"
    tasks:
      - "Label a row with a status pill"
      - "Show a count or category chip next to a title"
    failure_modes:
      - mistake: "Passing the icon as a component instead of an element"
        mechanism: "icon is typed SVGIconElement (a rendered element), like Button and Message; a component reference is a type error and renders nothing."
        wrong_pattern: |
          <Badge icon={StarRegularIcon}>Featured</Badge>
        correct_pattern: |
          <Badge icon={<StarRegularIcon />}>Featured</Badge>
        source: "packages/alouette/src/ui/data/Badge.tsx; ui/primitives/Icon.tsx"
        priority: "HIGH"
        status: "active"
      - mistake: "Passing className to Badge"
        mechanism: "BadgeProps is accent | size | variant | icon | children — there is no className or style prop. Appearance comes from accent + variant; spacing and placement come from a wrapping Box."
        wrong_pattern: |
          <Badge className="ml-xs bg-blue-500">New</Badge>
        correct_pattern: |
          <Box className="ml-xs"><Badge accent="info">New</Badge></Box>
        source: "packages/alouette/src/ui/data/Badge.tsx"
        priority: "MEDIUM"
        status: "active"
      - mistake: "Inventing variant or size values"
        mechanism: 'variant is exactly "solid" | "solid.enabled" | "outlined" (dotted name) and size is only "sm" | "md" — unlike Message there is no lg.'
        wrong_pattern: |
          <Badge variant="filled" size="lg">Active</Badge>
        correct_pattern: |
          <Badge variant="solid.enabled" size="md">Active</Badge>
        source: "packages/alouette/src/ui/data/Badge.tsx"
        priority: "MEDIUM"
        status: "active"
      - mistake: "Hand-rolling a pill with Box + Text"
        mechanism: "A manual pill uses raw Tailwind colors instead of accent tokens, so it ignores light/dark mode and the AccentScope, and its padding/radius drift from the scale."
        wrong_pattern: |
          <Box className="rounded-full bg-green-100 px-xs py-xxs"><Text className="text-xs">Paid</Text></Box>
        correct_pattern: |
          <Badge accent="success" size="sm">Paid</Badge>
        source: "packages/alouette/src/ui/data/Badge.tsx"
        priority: "MEDIUM"
        status: "active"
      - mistake: "Expecting Badge to be pressable"
        mechanism: "Badge renders a plain Box — no onPress, no role, no interactive token states. A tappable chip is PressableBox (alouette-actions)."
        wrong_pattern: |
          <Badge onPress={select}>Filter</Badge>
        correct_pattern: |
          <PressableBox onPress={select}><Badge>Filter</Badge></PressableBox>
        source: "packages/alouette/src/ui/data/Badge.tsx; ui/actions/PressableBox.tsx"
        priority: "LOW"
        status: "active"
