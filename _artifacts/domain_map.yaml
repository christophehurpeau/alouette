  - name: "Show dialogs and overlays"
    slug: "alouette-dialogs"
    domain: "dialogs"
    description: "Content above the screen. Modal is the general dialog: the caller controls whether it is open, and it is dismissed by the backdrop, its close button, Escape or the Android back gesture, with its footer pinned below a scrolling body. AlertDialog is the confirmation built on it — ask, acknowledge, or demand a decision that cannot be dismissed — with icon-fixed presets (QuestionAlertDialog, WarningAlertDialog, InfoAlertDialog, SuccessAlertDialog); confirming may be async, and the dialog stays open, locked, until it settles, rendering a failure in place. Popover is the chrome-less escape hatch for content that must escape a clipping ancestor — but a set of actions off a trigger is Menu + MenuItem, never a hand-built Popover. Load when adding a modal, confirmation, alert dialog, or a dropdown escaping a clipping container."
    type: "core"
    packages: ["alouette"]
    covers:
      - "Modal (visible, onClose, title, footer, accent)"
      - "AlertDialog (variant: confirm | alert | required)"
      - "QuestionAlertDialog / WarningAlertDialog / InfoAlertDialog / SuccessAlertDialog"
      - "Async onConfirm (the dialog stays open and locked until it settles)"
      - "Popover (open, anchorRef, align, width, placement)"
      - "PortalAccentScope"
    tasks:
      - "Open a modal with a pinned footer"
      - "Ask the user to confirm or acknowledge something"
      - "Await an async confirmation before closing"
      - "Show content that must escape a clipping ancestor"
    failure_modes:
      - mistake: "Labelling a Modal with aria-label instead of title"
        mechanism: "title is a required ModalProps prop and doubles as the accessible name via aria-labelledby; there is no aria-label, so every modal carries a visible heading."
        wrong_pattern: |
          <Modal visible={open} onClose={close} aria-label="Image preview">…</Modal>
        correct_pattern: |
          <Modal visible={open} onClose={close} title="Image preview">…</Modal>
        source: "packages/alouette/src/ui/containers/Modal.tsx"
        priority: "HIGH"
        status: "active"
      - mistake: "Building a confirmation out of a raw Modal"
        mechanism: 'AlertDialog sets role="alertdialog", wires the description to aria-describedby, hides the close button and builds the footer for the chosen variant; a hand-assembled Modal reimplements all of it and loses the async lock.'
        wrong_pattern: |
          <Modal visible={open} onClose={close} title="Discard changes?" footer={<><Button text="Cancel" /><Button text="Discard" /></>} />
        correct_pattern: |
          <QuestionAlertDialog visible={open} title="Discard changes?" onConfirm={discard} onCancel={close} />
        source: "packages/alouette/src/ui/containers/AlertDialog.tsx"
        priority: "HIGH"
        status: "active"
        skills: ["alouette-dialogs", "alouette-actions"]
      - mistake: "Putting the action buttons in children instead of footer"
        mechanism: "A row placed in children scrolls away with the body; footer stays pinned at the bottom of the scroll box on both platforms, right-aligns its buttons and takes on the separator border while content scrolls under it."
        wrong_pattern: |
          <Modal visible={open} onClose={close} title="Details"><Text>…</Text><HStack><Button text="Done" /></HStack></Modal>
        correct_pattern: |
          <Modal visible={open} onClose={close} title="Details" footer={<Button text="Done" onPress={close} />}><Text>…</Text></Modal>
        source: "packages/alouette/src/ui/containers/Modal.tsx"
        priority: "MEDIUM"
        status: "active"
      - mistake: "Wrapping the Modal element in AccentScope"
        mechanism: "The panel renders through a portal, outside the themed subtree, so a surrounding scope never reaches it; Modal rebuilds the theme inside with PortalAccentScope from its own accent prop."
        wrong_pattern: |
          <AccentScope accent="danger"><Modal visible={open} title="Delete project">…</Modal></AccentScope>
        correct_pattern: |
          <Modal accent="danger" visible={open} title="Delete project">…</Modal>
        source: "packages/alouette/src/ui/containers/PortalAccentScope.tsx"
        priority: "MEDIUM"
        status: "active"
        skills: ["alouette-dialogs", "alouette-theming"]
      - mistake: "Hand-building a menu out of a Popover"
        mechanism: "Popover brings no chrome and no roles. Menu + MenuItem is this Popover plus the menu/menuitem roles, the trigger's aria-haspopup/aria-expanded, arrow-key roving focus and close-on-select."
        wrong_pattern: |
          <Popover open={open} anchorRef={ref}><Surface>{actions}</Surface></Popover>
        correct_pattern: |
          <Menu trigger={…}><MenuItem text="Rename" onPress={rename} /></Menu>
        source: "packages/alouette/src/ui/actions/Menu.tsx"
        priority: "MEDIUM"
        status: "active"
        skills: ["alouette-dialogs", "alouette-actions"]
      - mistake: "Expecting a required dialog to close on backdrop/Escape"
        mechanism: 'variant="required" intentionally ignores the backdrop, Escape and the Android back button — only its explicit action closes it. Ordinary dialogs should stay dismissible (confirm / alert).'
        wrong_pattern: |
          <AlertDialog variant="required" visible={open} onClose={close} title="Details" />
        correct_pattern: |
          <AlertDialog variant="confirm" visible={open} onCancel={close} onConfirm={save} title="Save changes?" />
        source: "packages/alouette/src/ui/containers/AlertDialog.tsx"
        priority: "MEDIUM"
        status: "active"
      - mistake: "Passing icon to a preset dialog"
        mechanism: "The presets fix the icon; their props are AlertDialogUsageProps = every AlertDialog prop except icon. Use the base AlertDialog for a custom icon."
        wrong_pattern: |
          <WarningAlertDialog icon={<TrashRegularIcon />} visible={open} title="Delete?" />
        correct_pattern: |
          <AlertDialog icon={<TrashRegularIcon />} variant="confirm" visible={open} title="Delete?" />
        source: "packages/alouette/src/ui/containers/AlertDialog.tsx"
        priority: "LOW"
        status: "active"
