allowBuilds:
  esbuild: true
  unrs-resolver: true
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
nodeLinker: hoisted
overrides:
  # react-native-css loads Expo's copy; newer Lightning CSS versions fail with
  # "failed to deserialize ... Specifier". Keep Vite/Tailwind's copies independent.
  "@expo/metro-config>lightningcss": 1.33.0
packages:
  - packages/*
savePrefix: ^
