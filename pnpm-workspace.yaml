allowBuilds:
  esbuild: true
  unrs-resolver: true
dedupePeerDependents: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
nodeLinker: hoisted
packages:
  - packages/*
savePrefix: ^
overrides:
  # Added by pnpm-dedup.
  # Removing these makes `pnpm dedupe` resolve them back to a duplicate, so they
  # are what holds the deduplicated result. Keeping them is a workaround: no fix
  # was found that survives on its own. Please report this cluster so it can be
  # handled without a standing override: https://github.com/christophehurpeau/pm-tools/issues
  "@commitlint/types@": "21.0.1"
  "@typescript-eslint/eslint-plugin@": "8.63.0"
  "@typescript-eslint/parser@": "8.63.0"
  "@typescript-eslint/project-service@": "8.63.0"
  "@typescript-eslint/scope-manager@": "8.63.0"
  "@typescript-eslint/tsconfig-utils@": "8.63.0"
  "@typescript-eslint/type-utils@": "8.63.0"
  "@typescript-eslint/types@": "8.63.0"
  "@typescript-eslint/typescript-estree@": "8.63.0"
  "@typescript-eslint/utils@": "8.63.0"
  "@typescript-eslint/visitor-keys@": "8.63.0"
  "lightningcss@": "1.30.1"
