allowBuilds:
  esbuild: true
  unrs-resolver: true
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  - nightingale-levels
  - nightingale-types
nodeLinker: hoisted
overrides:
  "@expo/metro-config>lightningcss": 1.30.1
packages:
  - packages/*
patchedDependencies:
  react-native-css@3.1.0-rc.0: patches/react-native-css@3.1.0-rc.0.patch
savePrefix: ^
