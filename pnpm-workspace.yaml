allowBuilds:
  esbuild: true
  unrs-resolver: true
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  - nightingale-levels
  - nightingale-types
  - happy-dom@21.0.4
nodeLinker: hoisted
overrides:
  "@expo/metro-config>lightningcss": 1.33.0
packages:
  - packages/*
savePrefix: ^
