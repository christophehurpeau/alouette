# check-skills.yml — validates intent skills on pull requests touching
# skills or artifacts. Reconciliation after source changes is local:
# scripts/skills-status.ts (see .claude/skills/update-skills/SKILL.md).
#
# intent-workflow-version: 3

name: Check Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "**/skills/**"
      - "_artifacts/**"
      - "**/_artifacts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate intent skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install intent
        run: npm install -g @tanstack/intent

      - name: Validate skills
        run: intent validate --github-summary
